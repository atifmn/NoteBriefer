<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Summarizer</title>
    <link rel="icon" type="image/x-icon" href="/images/notepad.png">
    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="styling.css">
</head>

<body>
    <nav id="navbar" aria-label="Main navigation">
        <a class="brand" href="/">NoteBriefer</a>
        <div id="auth-container">
            <button id="login-btn" type="button">Sign in with Google</button>
            <p id="user-status">Not signed in</p>
            <button id="logout-btn" type="button" hidden="hidden">Sign Out</button>
        </div>
    </nav>

    <div id="gui-container">
        <h1>Note Summarizer</h1>

        <div class="split">
            <!-- Left side -->
            <div class="side">
                <h2>Upload Notes</h2>

                <div class="drop-box">
                    <p>Choose a text notes file</p>
                    <input type="file" id="file-input" accept=".txt,.md,text/plain,text/markdown">
                    <p id="file-status">No file selected.</p>
                </div>

                <button id="action-btn" type="button" disabled>Generate</button>
            </div>

            <!-- Right side -->
            <div id="result-box" class="side result-box">
                <h2>Summary</h2>
                <div id="result-text">Your summary will appear here.</div>
            </div>
        </div>
    </div>

    <!-- Connect the SupaBase DB -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Format Markdown and remove unsafe HTML from summaries -->
    <script src="https://cdn.jsdelivr.net/npm/marked@18.1.1/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.4.17/dist/purify.min.js"></script>

    <!-- Connect the JavaScript file -->
    <script src="app.js"></script>
</body>

</html>
