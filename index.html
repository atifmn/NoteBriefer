<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Note Summarizer</title>
    <link rel="icon" type="image/x-icon" href="/images/notepad.png">
    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="styling.css">
</head>

<body>


    <div id="gui-container">
        <h1>Note Summarizer</h1>
        
        <div id="auth-container">
            <button id="login-btn" type="button">Sign in with Google</button>

            <p id="user-status">Not logged in</p>

            <button id="logout-btn" type="button" hidden="hidden">Sign Out</button>

        </div>

        <div class="split">
            <!-- Left side -->
            <div class="side">
                <h2>Upload Notes</h2>

                <div class="drop-box">
                    <p>Choose a text notes file</p>
                    <input type="file" id="file-input" accept=".txt,.md,text/plain,text/markdown">
                    <p id="file-status">No file selected.</p>
                </div>

                <button id="action-btn" type="button" disabled>Generate</button>
            </div>

            <!-- Right side -->
            <div id="result-box" class="side result-box">
                <h2>Summary</h2>
                <p id="result-text">Your summary will appear here.</p>
            </div>
        </div>
    </div>

    <!-- Connect the SupaBase DB -->
    <script src="https://owaivsmckmdbqktrjisl.supabase.co"></script>

    <!-- Connect the JavaScript file -->
    <script src="app.js"></script>
</body>

</html>
